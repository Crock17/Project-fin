<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Moderne</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- SECTION HERO -->
  <section class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-20 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-10">
      
      <!-- Texte -->
      <div class="md:w-1/2">
        <h1 class="text-4xl md:text-6xl font-bold leading-tight">
          Bienvenue sur <span class="text-yellow-300">notre plateforme</span>
        </h1>
        <p class="mt-6 text-lg md:text-xl text-white/80">
          Simplifiez vos projets, boostez votre productivité, et atteignez vos objectifs plus vite avec notre solution intuitive.
        </p>
        <div class="mt-8 flex gap-4">
          <a href="#" class="bg-yellow-400 text-black font-semibold px-6 py-3 rounded-xl shadow hover:bg-yellow-300 transition">
            Commencer
          </a>
          <a href="#" class="border border-white/40 px-6 py-3 rounded-xl hover:bg-white/10 transition">
            En savoir plus
          </a>
        </div>
      </div>

      <!-- Image -->
      <div class="md:w-1/2">
        <img src="https://source.unsplash.com/600x400/?technology" alt="Illustration Hero" class="rounded-2xl shadow-lg" />
      </div>
      
    </div>
  </section>

</body>
</html>
